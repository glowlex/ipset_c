# tox -p
# pip install tox-workdir

[tox]
envlist = py38,py39,py310,py311,py312,py313,py313t,py314,py314t
# work_dir = ~/.tox

[testenv]
changedir = tests
skip_install = true
allowlist_externals = poetry
wheel = True
setenv =
    {py313t,py314t}: PYTHON_GIL=0
    POETRY_SOLVER_MIN_RELEASE_AGE=7
commands_pre =
    poetry lock
    poetry sync --no-root --no-cache --only tox
    poetry build -f wheel -o tests/dist
    pip uninstall --yes ipset_c
    pip install ipset_c --no-index --find-links dist
commands =
    poetry run pytest
